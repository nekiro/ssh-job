name: "ssh-job"
description: "Execute any script through ssh"
author: "Marcin Jałocha"
inputs:
  host:
    required: true
    description: "Target machine hostname or ip"
  port:
    required: false
    description: "Port to use while connecting"
    default: "22"
  key:
    description: "Ssh private key used to connect to target machine"
  passphrase:
    required: false
    description: "Passphrase for the private key"
  user:
    required: true
    description: "Ssh user"
  password:
    description: "Ssh password"
  fingerprint:
    required: false
    description: "SHA256 fingerprint of the server host key, the connection is rejected when it does not match"
  envs:
    description: "Environment variables passed to the shell script"
  ignoredEnvs:
    description: "Environment variables that are ommited from passing to the shell"
  command:
    required: true
    description: "Bash commands ran on target machine"
  exportActionOptions:
    required: false
    description: "Export all action options to shell script"
  tty:
    required: false
    default: "false"
    description: "Allocate a pseudo-terminal (TTY) for the SSH command"
  connectTimeout:
    required: false
    default: "20"
    description: "Seconds to wait for the SSH connection and authentication"
  timeout:
    required: false
    default: "0"
    description: "Seconds to wait for the command to finish, 0 disables the timeout"

runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "terminal"
  color: "gray-dark"
