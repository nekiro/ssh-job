name: "release"

# When a release vX.Y.Z is published, checks that dist/ matches the sources
# and moves the major tag (vX) to it, so `uses: nekiro/ssh-job@vX` gets the update.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Check that dist/ is up to date
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run package
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt "0" ]; then
            echo "dist/ does not match the sources, rebuild it and release again"
            git diff --stat
            exit 1
          fi

      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not in the vX.Y.Z format, major tag is not moved"
            exit 0
          fi

          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
